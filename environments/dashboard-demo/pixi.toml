[workspace]
name = "dashboard-demo"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
jupyterlab = ">=4.1"

# HoloViz ecosystem
panel = ">=1.4"
holoviews = ">=1.19"
hvplot = ">=0.10"
bokeh = ">=3.4"

# Streamlit
streamlit = ">=1.37"

# Voila
voila = ">=0.5"
ipywidgets = ">=8.1"

# Plotly Dash
dash = ">=2.17"
plotly = ">=5.22"

# Common data dependencies
numpy = ">=1.26"
pandas = ">=2.2"
