[workspace]
name = "data-science-demo"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
numpy = ">=1.26"
pandas = ">=2.2"
matplotlib = ">=3.8"
scikit-learn = ">=1.4"
jupyterlab = ">=4.1"
ipywidgets = ">=8.1"
scipy = ">=1.17.0,<2"
