[workspace]
name = "web-demo"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"

# Web frameworks
fastapi = ">=0.111"
flask = ">=3.0"
uvicorn = ">=0.30"

# HTTP clients
requests = ">=2.32"
httpx = ">=0.27"

# Jupyter web tools
jupyterlab = ">=4.1"
jupyter-server-proxy = ">=4.3"
